<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" aria-label="Amritsari Machhi Tikka - Crisp Ajwain Spiced River Fish Tikka">
  <defs>
    <radialGradient id="fishPlateBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#261E1A"/>
      <stop offset="70%" stop-color="#181310"/>
      <stop offset="100%" stop-color="#0D0907"/>
    </radialGradient>
    <linearGradient id="fishFryGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F39C12"/>
      <stop offset="35%" stop-color="#D68910"/>
      <stop offset="70%" stop-color="#B9770E"/>
      <stop offset="100%" stop-color="#7E5109"/>
    </linearGradient>
    <linearGradient id="fishFryGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E67E22"/>
      <stop offset="40%" stop-color="#CA6F1E"/>
      <stop offset="80%" stop-color="#A04000"/>
      <stop offset="100%" stop-color="#6E2C00"/>
    </linearGradient>
    <linearGradient id="mintChutney" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58D68D"/>
      <stop offset="60%" stop-color="#28B463"/>
      <stop offset="100%" stop-color="#1E8449"/>
    </linearGradient>
    <filter id="crispShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Dark Gourmet Slate Background -->
  <rect width="400" height="300" fill="url(#fishPlateBg)"/>

  <!-- Platter Shadow -->
  <ellipse cx="200" cy="225" rx="155" ry="30" fill="#000000" opacity="0.6" filter="blur(6px)"/>

  <!-- Brass / Clay Heritage Serving Platter -->
  <ellipse cx="200" cy="195" rx="150" ry="55" fill="#2C221D" stroke="#B58A4A" stroke-width="1.5"/>
  <ellipse cx="200" cy="193" rx="142" ry="50" fill="#201713"/>

  <!-- Fresh Mint & Coriander Chutney Katori (Clay Bowl) -->
  <g transform="translate(90, 140)" filter="url(#crispShadow)">
    <ellipse cx="0" cy="18" rx="28" ry="14" fill="#3D291F" stroke="#8A5D3B" stroke-width="1.5"/>
    <ellipse cx="0" cy="16" rx="25" ry="11" fill="url(#mintChutney)"/>
    <circle cx="-5" cy="14" r="2" fill="#D5F5E3" opacity="0.7"/>
    <!-- Yogurt swirl in chutney -->
    <path d="M -8 15 Q 0 10 8 16 Q 2 20 -4 17" stroke="#FCFAF5" stroke-width="1.5" fill="none" opacity="0.85"/>
  </g>

  <!-- Golden Fried Amritsari Fish Tikka Chunks (Fillets with spiced besan & ajwain crust) -->
  <g filter="url(#crispShadow)">
    
    <!-- Chunk 1 (Center-Left) -->
    <g transform="translate(160, 150) rotate(-10)">
      <path d="M 0 0 C 15 -15, 55 -10, 65 15 C 68 35, 45 55, 15 50 C -10 45, -15 15, 0 0 Z" fill="url(#fishFryGrad1)"/>
      <!-- Flaky tender white fish interior glimpse -->
      <path d="M 20 8 Q 35 12 45 22" stroke="#FFF9E6" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
      <!-- Crisp Spiced Crust & Ajwain seeds -->
      <circle cx="15" cy="18" r="1.5" fill="#422506"/>
      <circle cx="28" cy="12" r="1.2" fill="#2C1201"/>
      <circle cx="38" cy="25" r="1.5" fill="#381803"/>
      <circle cx="22" cy="35" r="1.2" fill="#2A0F02"/>
      <ellipse cx="32" cy="30" rx="2" ry="1" fill="#1C0A01" transform="rotate(30 32 30)"/>
      <ellipse cx="48" cy="18" rx="2" ry="1" fill="#1C0A01" transform="rotate(-40 48 18)"/>
      <!-- Chaat masala dusting -->
      <circle cx="25" cy="22" r="1.8" fill="#C0392B" opacity="0.6"/>
      <circle cx="42" cy="32" r="1.5" fill="#C0392B" opacity="0.7"/>
    </g>

    <!-- Chunk 2 (Center-Right) -->
    <g transform="translate(230, 145) rotate(15)">
      <path d="M 5 0 C 30 -10, 60 5, 62 28 C 62 48, 35 58, 10 52 C -8 45, -10 15, 5 0 Z" fill="url(#fishFryGrad2)"/>
      <!-- Flaky fish texture -->
      <path d="M 18 15 Q 32 18 45 28" stroke="#FFF9E6" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
      <!-- Ajwain carom seeds & crackling crust -->
      <ellipse cx="22" cy="22" rx="2" ry="1" fill="#1C0A01" transform="rotate(20 22 22)"/>
      <ellipse cx="38" cy="15" rx="2" ry="1" fill="#1C0A01" transform="rotate(-25 38 15)"/>
      <circle cx="30" cy="35" r="1.5" fill="#3D1A04"/>
      <circle cx="48" cy="30" r="1.2" fill="#2E1101"/>
      <!-- Degi mirch / Chaat masala dust -->
      <circle cx="15" cy="30" r="1.5" fill="#D9534F" opacity="0.65"/>
    </g>

    <!-- Chunk 3 (Foreground Center) -->
    <g transform="translate(185, 180) rotate(5)">
      <path d="M 0 5 C 20 -10, 50 -5, 60 18 C 65 38, 40 50, 15 48 C -10 42, -15 20, 0 5 Z" fill="url(#fishFryGrad1)"/>
      <path d="M 12 18 Q 28 20 42 28" stroke="#FFFDF5" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
      <!-- Crispy batter bubbles & ajwain seeds -->
      <circle cx="20" cy="28" r="2" fill="#D68910" stroke="#7E5109" stroke-width="0.5"/>
      <ellipse cx="28" cy="16" rx="2.2" ry="1" fill="#1B0A01" transform="rotate(45 28 16)"/>
      <ellipse cx="40" cy="22" rx="2" ry="1" fill="#1B0A01" transform="rotate(-15 40 22)"/>
      <circle cx="35" cy="35" r="1.5" fill="#3D1A04"/>
    </g>

    <!-- Chunk 4 (Top Center) -->
    <g transform="translate(195, 120) rotate(-5)">
      <path d="M 0 5 C 18 -8, 45 -5, 52 15 C 55 30, 35 42, 12 40 C -8 35, -10 18, 0 5 Z" fill="url(#fishFryGrad2)"/>
      <ellipse cx="20" cy="15" rx="1.8" ry="1" fill="#1B0A01" transform="rotate(30 20 15)"/>
      <ellipse cx="32" cy="22" rx="1.8" ry="1" fill="#1B0A01" transform="rotate(-30 32 22)"/>
    </g>

  </g>

  <!-- Pickled Red Onion Rings & Green Chilies -->
  <g>
    <ellipse cx="310" cy="190" rx="18" ry="9" fill="none" stroke="#C23B58" stroke-width="2.5" transform="rotate(-20 310 190)"/>
    <ellipse cx="310" cy="190" rx="14" ry="6" fill="none" stroke="#F8D7DA" stroke-width="1.2" transform="rotate(-20 310 190)"/>
    
    <!-- Slit Green Chili (Hari Mirch) -->
    <path d="M 285 220 Q 305 210 325 218 Q 305 215 285 220 Z" fill="#28B463" stroke="#1E8449" stroke-width="1"/>
  </g>

  <!-- Fresh Lemon Wedge -->
  <g transform="translate(125, 205) rotate(15)" filter="url(#crispShadow)">
    <path d="M 0 0 C 12 -12, 30 -12, 38 0 Z" fill="#F4D03F" stroke="#D4AC0D" stroke-width="1.2"/>
    <path d="M 3 -1 C 13 -10, 27 -10, 35 -1 Z" fill="#FDFEFE"/>
    <path d="M 5 -1 C 14 -8, 26 -8, 33 -1 Z" fill="#F9E79F"/>
  </g>

  <!-- Fresh Coriander Leaves Sprinkles -->
  <g fill="#27AE60">
    <path d="M 200 160 C 204 154, 210 156, 208 162 C 205 166, 198 164, 200 160 Z"/>
    <path d="M 245 170 C 249 164, 255 166, 253 172 C 250 176, 243 174, 245 170 Z"/>
    <path d="M 215 205 C 219 199, 225 201, 223 207 C 220 211, 213 209, 215 205 Z"/>
  </g>

  <!-- Authentic Badge -->
  <rect x="16" y="16" width="165" height="24" rx="4" fill="#5A1F24" fill-opacity="0.9" stroke="#B58A4A" stroke-width="1"/>
  <text x="98" y="32" fill="#FCFAF5" font-family="serif" font-size="10" font-weight="bold" letter-spacing="1" text-anchor="middle">AMRITSARI MACHHI TIKKA</text>
</svg>
